# Reproducible, signed releases. VERIFY.md explains how to check one.
#
# Two kinds of artifact, both rebuildable from the Go module proxy with a
# pinned toolchain and no per-build inputs:
#
#   - the connector archives (darwin and windows, amd64 and arm64): goreleaser
#     builds them in proxy mode (a scratch module named after the build id
#     requiring github.com/Masseuse-ai/masseuse-camlink at the tag), so the binary
#     embeds this module's version and sum.golang.org hash;
#   - the raw gateway binaries: produced by the release workflow with the one
#     command the enclave image and anyone else can repeat,
#     `go install github.com/Masseuse-ai/masseuse-camlink/cmd/masseuse-camlink-gateway@vX.Y.Z`,
#     and handed to goreleaser as extra files so they are listed in
#     checksums.txt, signed and covered by the provenance like everything
#     else. (A goreleaser proxy build embeds a different main module and
#     would not be byte-identical to `go install`; the `reproduce` job in
#     .github/workflows/release.yml checks that these are.)
#
# The darwin connector binaries are additionally signed with FemLed's Apple
# Developer ID (Team ID B8Z4RP3846) and notarized, so macOS runs them from
# Terminal without a Gatekeeper warning. The signature is the one per-build
# input: `cmd/machostrip` removes it, and the rest of the binary is byte for
# byte the proxy build (VERIFY.md, "The macOS binaries"; the `reproduce` job
# checks this too). The signing identity and notary credentials come from
# repository secrets; without them (a fork, a local snapshot) the step is
# skipped and the darwin binaries ship unsigned.
#
# The downloads people get are not goreleaser's, and are named Masseuse.ai:
# the release workflow's `macos-app` job takes the two darwin archives
# published here, joins their binaries into a universal `Masseuse.app`
# with ffmpeg inside, signs, notarizes and staples the app and the disk
# image around it (`Masseuse.ai-<version>.dmg`), and adds them to the
# release with `checksums-darwin.txt`, its signature bundle and
# `darwin.intoto.jsonl` (packaging/macos/README.md; VERIFY.md, "The macOS
# app"); the `windows-app` job appends a cross-compiled `ffmpeg.exe` and the
# unit driver helpers to the windows_amd64 archive's binary as a payload,
# signs the result with Azure Artifact Signing and publishes it as the one
# file `Masseuse.exe`, listed in `checksums-windows.txt` with
# `windows.intoto.jsonl` (packaging/windows/README.md; VERIFY.md, "The
# Windows package"); `cmd/pestrip` strips the signature and the payload and
# gives the archive's binary back.
version: 2
project_name: masseuse-camlink

gomod:
  proxy: true
  mod: mod
  env:
    - GOPROXY=https://proxy.golang.org,direct
    - GOSUMDB=sum.golang.org
    - GOFLAGS=-mod=mod

env:
  - CGO_ENABLED=0
  - GOTOOLCHAIN=go1.27.1

builds:
  - id: connector
    main: ./cmd/masseuse-camlink
    binary: masseuse-camlink
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid=
    mod_timestamp: "{{ .CommitTimestamp }}"
    # The two systems the program is offered for. The connector still
    # compiles for Linux (the gateway below is a Linux program, and ci.yml
    # keeps the cross-compile), but no Linux archive is published.
    goos: [darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: connector
    ids: [connector]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - VERIFY.md
      # The unit driver helpers for the archive's platform (docs/UNITS.md),
      # fetched and verified by packaging/units/fetch-all.sh into
      # units-bin/<os>_<arch>/ by the workflow before goreleaser runs
      # (the darwin archives carry the thin binaries for their
      # architecture; the application bundle takes the universal one). A
      # platform without helpers gives an archive without a units/
      # directory, and the connector then serves the Mastago alone.
      - src: "units-bin/{{ .Os }}_{{ .Arch }}/camlink-unit-*"
        dst: units
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    # masseuse-camlink-gateway_<version>_linux_<arch>, written by the
    # workflow's "go install the gateway" step (see the header).
    - glob: ./gateway-bin/*

# Sign and notarize the darwin binaries before they are archived (goreleaser
# embeds anchore/quill, so this runs on the Linux release runner). The p12
# must carry the Apple chain (`quill p12 attach-chain`). Every field is a
# strict template: a missing secret fails the release instead of shipping an
# unnotarized binary.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [connector]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    output: true

release:
  github:
    owner: Masseuse-ai
    name: masseuse-camlink
  prerelease: auto
  extra_files:
    - glob: ./gateway-bin/*
  # The release notes are brief: Install and Verify here, and a Changes
  # section the release identity puts above them. The Mac and Windows
  # downloads are added by the macos-app and windows-app jobs a few minutes
  # after this release is created.
  footer: |
    ## Install

    - **Mac:** open `Masseuse.ai-{{ .Version }}.dmg` and drag Masseuse to Applications. Signed with FemLed, Inc.'s Apple Developer ID and notarized by Apple.
    - **Windows:** save `Masseuse.exe` and open it. Signed by Principled Labs, Inc.

    Installed copies update themselves.

    ## Verify

    `scripts/verify-release.sh {{ .Tag }}` checks every download's signature and provenance; VERIFY.md explains how.

changelog:
  disable: true
