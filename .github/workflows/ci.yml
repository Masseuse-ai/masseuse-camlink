name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The exact toolchain, not a minimum: go.mod's `go` line is a floor, and a
  # newer local Go would otherwise be used silently. Releases pin the same.
  GOTOOLCHAIN: go1.27.1
  GOFLAGS: -mod=mod

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - name: go mod tidy is a no-op
        run: |
          cp go.mod /tmp/go.mod && cp go.sum /tmp/go.sum
          go mod tidy
          diff -u /tmp/go.mod go.mod && diff -u /tmp/go.sum go.sum
      - name: go test -race
        run: go test -race -count=1 ./...
      - name: fuzz smoke
        run: |
          go test -run=^$ -fuzz=FuzzDecode -fuzztime=20s ./internal/frame/
          go test -run=^$ -fuzz=FuzzDecodeReply -fuzztime=10s ./internal/estim/mastago/
          go test -run=^$ -fuzz=FuzzParseCommand -fuzztime=10s ./internal/estim/
          go test -run=^$ -fuzz=FuzzParseSettings -fuzztime=10s ./internal/estim/
      - name: build
        run: |
          mkdir -p bin
          go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o bin/ ./cmd/...
          ./bin/masseuse-camlink --version
          ./bin/masseuse-camlink-gateway --version
      - name: cross-compile the connector without cgo
        # The Bluetooth, serial port and USB discovery code has a file per
        # system; every release target must build with CGO_ENABLED=0 as the
        # release does. linux/amd64 is not a release target of the connector
        # (nothing is published for Linux) but the gateway is a Linux
        # program, and the per-system files must keep compiling there.
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -buildvcs=false -o /dev/null ./cmd/masseuse-camlink
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go vet ./internal/ble/ ./internal/serialport/ ./internal/estim/...
          done

  macos-bundle:
    # The macOS application bundle (packaging/macos) assembled unsigned, so
    # a broken plist, script or layout is caught here rather than on a tag;
    # and the tests that need Apple's tools (lipo, codesign, sh) run on the
    # system they are for. ffmpeg is not built on pull requests (minutes);
    # a stand-in takes its place in the bundle. macOS 26, because actool
    # compiles the layered icon (packaging/macos/README.md, "The icon") only
    # on the system whose asset runtime it uses: on a macOS 15 runner it
    # crashes ("AssetCatalogAgent-AssetRuntime closed the connection").
    # release.yml builds the Mac download on the same image.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: go test on macOS
        run: go test -count=1 ./cmd/... ./internal/capture/ ./internal/machosig/ ./internal/ble/ ./internal/awake/ ./internal/estim/helper/ ./internal/update/
      - name: Unsigned bundle and disk image
        run: |
          mkdir -p dist/ffmpeg/licenses dist/ffmpeg/sources
          for arch in arm64 amd64; do
            GOOS=darwin GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' \
              -o "dist/masseuse-camlink_${arch}" ./cmd/masseuse-camlink
          done
          lipo -create -output dist/masseuse-camlink dist/masseuse-camlink_arm64 dist/masseuse-camlink_amd64
          # The desktop window, the bundle's executable, as release.yml builds it.
          (cd desktop/frontend && npm ci && npm run build)
          for arch in arm64 amd64; do
            (cd desktop && CGO_ENABLED=1 GOOS=darwin GOARCH="$arch" MACOSX_DEPLOYMENT_TARGET=13.0 \
              CGO_CFLAGS=-mmacosx-version-min=13.0 CGO_LDFLAGS=-mmacosx-version-min=13.0 \
              go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -X main.version=v0.0.0" -o "../dist/shell_${arch}" .)
          done
          lipo -create -output dist/Masseuse dist/shell_arm64 dist/shell_amd64
          cp /usr/bin/true dist/ffmpeg/ffmpeg # a Mach-O stand-in, so codesign has nested code to seal
          printf 'stand-in for the licence texts (ci)\n' > dist/ffmpeg/licenses/README
          sh packaging/units/fetch.sh "$(tr -d '[:space:]' < packaging/units/VERSION)" darwin all dist/units
          sh packaging/macos/build-app.sh -v 0.0.0 -s dist/Masseuse -b dist/masseuse-camlink -f dist/ffmpeg -u dist/units -o dist
          ls dist/Masseuse.app/Contents/Helpers/units/camlink-unit-* >/dev/null
          # The bundle's connector finds the helpers where the bundle puts them.
          dist/Masseuse.app/Contents/MacOS/masseuse-camlink -state-dir "${RUNNER_TEMP}/probe-state" -estim-ble off estim probe > probe.txt 2>&1 || true
          grep -F 'Unit drivers: Mastago (built in) + 1 helper(s)' probe.txt || { cat probe.txt; exit 1; }
          plutil -lint dist/Masseuse.app/Contents/Info.plist
          test "$(plutil -extract CFBundleExecutable raw -o - dist/Masseuse.app/Contents/Info.plist)" = Masseuse
          test "$(plutil -extract CFBundleDisplayName raw -o - dist/Masseuse.app/Contents/Info.plist)" = Masseuse
          # The icon both ways: the icns, and the catalog with macOS 26's layered icon in it.
          test -f dist/Masseuse.app/Contents/Resources/masseuse-camlink.icns
          test "$(plutil -extract CFBundleIconName raw -o - dist/Masseuse.app/Contents/Info.plist)" = masseuse-camlink
          assetutil --info dist/Masseuse.app/Contents/Resources/Assets.car | grep -q '"masseuse-camlink.iconstack"'
          test "$(lipo -archs dist/Masseuse.app/Contents/MacOS/Masseuse)" = "x86_64 arm64"
          test "$(lipo -archs dist/Masseuse.app/Contents/MacOS/masseuse-camlink)" = "x86_64 arm64"
          go run ./cmd/machostrip -sha256 dist/Masseuse.app/Contents/MacOS/masseuse-camlink
          # The window answers --version without opening; the connector beside it is the console program.
          test "$(dist/Masseuse.app/Contents/MacOS/Masseuse --version | cut -d' ' -f1)" = v0.0.0
          dist/Masseuse.app/Contents/MacOS/masseuse-camlink --version
          # The release's signing plan, ad hoc: the bundle's executable and
          # ffmpeg carry the camera and microphone entitlements, the
          # connector and the helpers none (packaging/macos/sign-app.sh,
          # device.entitlements); assess.sh reads them back the way the
          # release does. v0.16.0 and v0.17.0 shipped the executable without
          # them, and macOS refused the camera without a prompt.
          plutil -lint packaging/macos/device.entitlements
          sh packaging/macos/sign-app.sh -i - dist/Masseuse.app
          sh packaging/macos/assess.sh entitlements dist/Masseuse.app
          sh packaging/macos/build-dmg.sh -a dist/Masseuse.app -v 0.0.0 -o dist
          hdiutil imageinfo dist/Masseuse.ai-0.0.0.dmg | grep -E '^Format: UDZO'
          # The volume is named after the app, so the Finder's sidebar says so.
          hdiutil attach -readonly -nobrowse -noautoopen dist/Masseuse.ai-0.0.0.dmg | grep -q '/Volumes/Masseuse.ai$'
          test -d /Volumes/Masseuse.ai/Masseuse.app
          hdiutil detach /Volumes/Masseuse.ai -quiet

  windows-package:
    # The Windows download (packaging/windows) assembled with a stand-in
    # ffmpeg.exe, so a broken script, resource file or console path is
    # caught here rather than on a tag; and the connector's, capture's,
    # Bluetooth backend's and stimulation link's tests run on the system
    # the package is for (the runner has no Bluetooth radio: the backend's
    # Open must say so, through the Windows Runtime, without hanging). The
    # committed resource objects must be what make-syso.sh produces from
    # winres.json and the icon (go-winres is deterministic), and the built
    # program must show Explorer the strings in them.
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: go test on Windows
        run: go test -count=1 -v -run 'TestOpenWithoutBluetooth|TestScanEndsOnDeadline' ./internal/ble/ && go test -count=1 ./cmd/masseuse-camlink/ ./internal/capture/ ./internal/awake/ ./internal/ble/ ./internal/estim/... ./internal/update/ ./internal/payload/ ./internal/pesig/... ./packaging/windows/pack/
      - name: The committed resource objects are current
        run: |
          sh packaging/windows/make-syso.sh
          git status --porcelain -- cmd/masseuse-camlink/*.syso desktop/*.syso
          test -z "$(git status --porcelain -- cmd/masseuse-camlink/*.syso desktop/*.syso)" ||
            { echo "the rsrc_windows_*.syso files differ from what packaging/windows/make-syso.sh produces; run it and commit" >&2; exit 1; }
      - name: Build the connector and the window
        # The window as release.yml builds it: the page, then the Go
        # program for the GUI subsystem (no console of its own; the
        # connector's runs hidden behind it) with the resource object above.
        run: |
          mkdir -p dist/ffmpeg-windows/licenses
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o dist/masseuse-camlink.exe ./cmd/masseuse-camlink
          dist/masseuse-camlink.exe --version
          (cd desktop/frontend && npm ci && npm run build)
          (cd desktop && CGO_ENABLED=0 go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui -X main.version=v0.0.0" -o ../dist/shell/Masseuse.exe .)
          test "$(dist/shell/Masseuse.exe --version | cut -d' ' -f1)" = v0.0.0
      - name: Explorer's view of the programs
        # packaging/windows/verinfo reads the strings the way Explorer does;
        # PowerShell's VersionInfo would report them empty, since the
        # resource carries no FileVersion string on purpose. Both programs
        # carry the same strings.
        run: |
          for exe in dist/masseuse-camlink.exe dist/shell/Masseuse.exe; do
            go run ./packaging/windows/verinfo "$exe" | tee dist/verinfo.txt
            grep -qx 'ProductName: Masseuse.ai' dist/verinfo.txt
            grep -qx 'CompanyName: FemLed, Inc.' dist/verinfo.txt
            grep -qx 'FileDescription: Masseuse.ai for your computer' dist/verinfo.txt
          done
      - name: The package, with a stand-in ffmpeg
        # packaging/windows/pack appends the payload to the window;
        # cmd/pestrip takes it off again and must give the window's hash
        # back, and the connector inside is the one packed. Unpacked as the
        # window unpacks it, the connector finds the helper beside itself.
        run: |
          cp dist/masseuse-camlink.exe dist/ffmpeg-windows/ffmpeg.exe
          printf 'stand-in for the licence texts (ci)\n' > dist/ffmpeg-windows/licenses/README
          sh packaging/units/fetch.sh "$(tr -d '[:space:]' < packaging/units/VERSION)" windows amd64 dist/units
          go run ./packaging/windows/pack -v 0.0.0 -s dist/shell/Masseuse.exe -b dist/masseuse-camlink.exe -f dist/ffmpeg-windows -u dist/units -o dist/Masseuse.exe | tee pack.txt
          grep -q ' masseuse-camlink.exe$' pack.txt
          grep -q ' units/camlink-unit-.*\.exe$' pack.txt
          grep -q ' README.txt$' pack.txt
          test "$(go run ./cmd/pestrip -sha256 dist/Masseuse.exe)" = "$(sha256sum dist/shell/Masseuse.exe | cut -d' ' -f1)"
          go run ./cmd/pestrip -payload dist/payload-check dist/Masseuse.exe > /dev/null
          cmp dist/masseuse-camlink.exe dist/payload-check/masseuse-camlink.exe
          cmp dist/ffmpeg-windows/ffmpeg.exe dist/payload-check/ffmpeg.exe
          alone="${RUNNER_TEMP}/alone"; mkdir -p "$alone" && cp dist/Masseuse.exe "$alone/"
          "$alone/Masseuse.exe" --version
          dist/payload-check/masseuse-camlink.exe -state-dir "$(cygpath -w "${RUNNER_TEMP}/probe-state")" -estim-ble off estim probe > probe.txt 2>&1 || true
          grep -F 'Unit drivers: Mastago (built in) + 1 helper(s)' probe.txt || { cat probe.txt; exit 1; }

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...

  desktop:
    # The desktop shell (desktop/, docs/DESKTOP.md): its own Go module, so
    # the connector's `go vet ./...` above never sees it. The page must
    # typecheck and build, the Go shell must vet, build and pass its tests
    # on each of the two systems it ships for (cgo: the window toolkit is
    # native), and the generated bindings committed under frontend/bindings
    # must be what the Go services say.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: |
            desktop/go.sum
            go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: frontend
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: bindings are current
        if: runner.os == 'macOS'
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.23
          wails3 generate bindings -ts -i
          git diff --exit-code -- frontend/bindings
      - name: go vet, build and test
        run: |
          # gofmt on the two systems whose checkout keeps LF (Git on the
          # Windows runner writes CRLF, which gofmt reports on every file).
          if [ "$RUNNER_OS" != Windows ]; then gofmt -l . && test -z "$(gofmt -l .)"; fi
          go vet ./...
          go build -trimpath -buildvcs=false -o /dev/null .
          # The race detector needs a C toolchain the Windows runner does
          # not pair with this build; the other two run under it.
          if [ "$RUNNER_OS" = Windows ]; then go test -count=1 ./...; else go test -count=1 -race ./...; fi
