name: release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  GOTOOLCHAIN: go1.27.1
  GOFLAGS: -mod=mod

jobs:
  goreleaser:
    # The connector archives (darwin and windows, amd64 and arm64) and the
    # raw gateway binaries; the downloads people get are the macos-app and
    # windows-app jobs' below. Nothing is published for Linux.
    runs-on: ubuntu-latest
    permissions:
      contents: write # release and its assets
      id-token: write # keyless signing (Fulcio)
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: The tag must be reachable through the module proxy
        # goreleaser builds from proxy.golang.org, so the module must resolve
        # there first; this also warms the proxy for the reproduce job.
        run: |
          for i in $(seq 1 20); do
            if GOPROXY=https://proxy.golang.org GONOSUMDB= GOFLAGS= go list -m "github.com/FemLed/masseuse-camlink@${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 15
          done
          echo "proxy.golang.org does not serve ${GITHUB_REF_NAME}; is the repository public?" >&2
          exit 1
      - name: go install the gateway
        # The published gateway binaries are exactly what this command
        # yields, so the enclave image (and VERIFY.md) can repeat it and
        # compare. goreleaser lists them in checksums.txt as extra files.
        env:
          CGO_ENABLED: "0"
          GOFLAGS: ""
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p gateway-bin
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go install -trimpath -buildvcs=false -ldflags='-s -w -buildid=' \
              "github.com/FemLed/masseuse-camlink/cmd/masseuse-camlink-gateway@${GITHUB_REF_NAME}"
            src="$(go env GOPATH)/bin/linux_${arch}/masseuse-camlink-gateway"
            [ -f "$src" ] || src="$(go env GOPATH)/bin/masseuse-camlink-gateway"
            cp "$src" "gateway-bin/masseuse-camlink-gateway_${version}_linux_${arch}"
          done
          sha256sum gateway-bin/*
          go version -m gateway-bin/masseuse-camlink-gateway_${version}_linux_amd64
      - name: The unit driver helpers for every archive, verified
        # packaging/units/fetch-all.sh: every helpers release
        # packaging/units/VERSION pins (one per line), from
        # masseuse.ai/app/units, each manifest's signature checked against
        # packaging/units/cosign.pub and each file against its manifest
        # (docs/UNITS.md). goreleaser packs units-bin/<os>_<arch>/ into the
        # archive for that platform (.goreleaser.yaml).
        run: |
          for target in darwin/arm64 darwin/amd64 windows/amd64 windows/arm64; do
            sh packaging/units/fetch-all.sh "${target%/*}" "${target#*/}" "units-bin/${target%/*}_${target#*/}"
          done
          find units-bin -type f | sort
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple Developer ID signing and notarization of the darwin
          # binaries (.goreleaser.yaml, notarize): the with-chain .p12 and
          # the App Store Connect key, base64; the p12 password; the key's
          # id and issuer. All five are needed; the templates are strict.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          # Referenced only so the runner masks its value in the public job
          # log: the signing certificate's subject, which the embedded signer
          # prints at debug level. Nothing reads it.
          MACOS_SIGN_SUBJECT: ${{ secrets.MACOS_SIGN_SUBJECT }}
      - name: Subjects for provenance
        id: hashes
        run: echo "hashes=$(base64 -w0 < dist/checksums.txt)" >> "$GITHUB_OUTPUT"

  provenance:
    needs: goreleaser
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.goreleaser.outputs.hashes }}
      provenance-name: multiple.intoto.jsonl
      upload-assets: true

  reproduce:
    # An independent rebuild on a fresh runner, from the module proxy and
    # without a checkout: the bytes the recipes in VERIFY.md produce must be
    # the bytes the release published.
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CGO_ENABLED: "0"
      GOFLAGS: ""
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Download the published checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 20); do
            gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern checksums.txt --clobber && break
            sleep 15
          done
          cat checksums.txt
      - name: Gateway, go install at the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go install -trimpath -buildvcs=false -ldflags='-s -w -buildid=' \
              "github.com/FemLed/masseuse-camlink/cmd/masseuse-camlink-gateway@${GITHUB_REF_NAME}"
            bin="$(go env GOPATH)/bin/linux_${arch}/masseuse-camlink-gateway"
            [ -f "$bin" ] || bin="$(go env GOPATH)/bin/masseuse-camlink-gateway"
            sum=$(sha256sum "$bin" | cut -d' ' -f1)
            echo "rebuilt linux/${arch} ${sum}"
            grep -F "masseuse-camlink-gateway_${version}_linux_${arch}" checksums.txt
            grep -qF "${sum}  masseuse-camlink-gateway_${version}_linux_${arch}" checksums.txt
          done
          echo "reproduced: the published gateway binaries are the bytes go install produces"
      - name: Connector, scratch module at the tag
        # goreleaser's proxy build: a module named after the build id
        # ("connector") requiring this module at the tag, built with the
        # same flags. VERIFY.md gives this recipe. The windows/amd64 archive
        # is the unsigned one (the darwin binaries are signed below; the
        # Windows signature goes on the package, not the archive), so it is
        # compared as published, byte for byte, its resource object
        # (cmd/masseuse-camlink/rsrc_windows_amd64.syso) included.
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir connector && cd connector
          printf 'module connector\n' > go.mod
          go get "github.com/FemLed/masseuse-camlink@${GITHUB_REF_NAME}"
          GOOS=windows GOARCH=amd64 go build -mod=mod -trimpath -buildvcs=false -ldflags='-s -w -buildid=' \
            -o masseuse-camlink.exe github.com/FemLed/masseuse-camlink/cmd/masseuse-camlink
          sum=$(sha256sum masseuse-camlink.exe | cut -d' ' -f1)
          echo "rebuilt windows/amd64 connector ${sum}"
          cd ..
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "masseuse-camlink_${version}_windows_amd64.zip" --clobber
          unzip -o -q "masseuse-camlink_${version}_windows_amd64.zip" masseuse-camlink.exe
          published=$(sha256sum masseuse-camlink.exe | cut -d' ' -f1)
          echo "published windows/amd64 connector ${published}"
          test "$sum" = "$published"
          echo "reproduced: the connector in the archive is the bytes the scratch-module build produces"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Connector, darwin, signature stripped
        # The darwin binaries are signed with the Developer ID and notarized,
        # so they cannot match a rebuild as published. Strip the signature
        # from both sides with cmd/machostrip (the Go project checks its own
        # macOS distributions this way) and compare; and check that what was
        # published does carry a signature, so a release with the signing
        # step silently skipped fails here.
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd connector
          for arch in arm64 amd64; do
            GOOS=darwin GOARCH="$arch" go build -mod=mod -trimpath -buildvcs=false -ldflags='-s -w -buildid=' \
              -o "rebuilt_darwin_${arch}" github.com/FemLed/masseuse-camlink/cmd/masseuse-camlink
            gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --pattern "masseuse-camlink_${version}_darwin_${arch}.tar.gz" --clobber
            tar -xzOf "masseuse-camlink_${version}_darwin_${arch}.tar.gz" masseuse-camlink > "published_darwin_${arch}"
            go run "github.com/FemLed/masseuse-camlink/cmd/machostrip@${GITHUB_REF_NAME}" -sha256 \
              "rebuilt_darwin_${arch}" "published_darwin_${arch}" | tee "stripped_${arch}.txt"
            test "$(cut -d' ' -f1 < "stripped_${arch}.txt" | uniq | wc -l)" -eq 1
            raw=$(sha256sum "published_darwin_${arch}" | cut -d' ' -f1)
            stripped=$(head -n 1 "stripped_${arch}.txt" | cut -d' ' -f1)
            if [ "$raw" = "$stripped" ]; then
              echo "the published darwin/${arch} binary carries no code signature" >&2
              exit 1
            fi
            echo "reproduced: darwin/${arch} connector matches the rebuild once its signature is stripped"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-check:
    # The program updates itself (internal/update, README "Updates"). The
    # published windows/amd64 connector archive, run as an install of its
    # own (the terminal connector, the layout an archive gives), must find
    # itself up to date; and told it is an older release
    # (MASSEUSE_CAMLINK_UPDATE_AS) it must download this very release from
    # GitHub, verify the checksums' signature and the provenance against
    # the real Sigstore records, stage it, and swap it in: the whole path a
    # person's computer takes at the next release, run here at this one.
    # (update-check-macos and update-check-windows below do the same for
    # the two downloads people get.)
    needs: [goreleaser, provenance]
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: The published windows/amd64 connector
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p install && cd install
          for i in $(seq 1 20); do
            gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber \
              --pattern "masseuse-camlink_${version}_windows_amd64.zip" && break
            sleep 15
          done
          7z x -y "masseuse-camlink_${version}_windows_amd64.zip" > /dev/null
          rm "masseuse-camlink_${version}_windows_amd64.zip"
          ./masseuse-camlink.exe --version
      - name: It knows it is the latest release
        run: |
          out=$(install/masseuse-camlink.exe -state-dir "$(cygpath -w "${RUNNER_TEMP}/state-1")" update)
          echo "$out"
          echo "$out" | grep -q "^Up to date: ${GITHUB_REF_NAME} is the latest release"
      - name: As an older release, it updates itself to this one
        env:
          MASSEUSE_CAMLINK_UPDATE_AS: v0.10.0
        run: |
          before=$(sha256sum install/masseuse-camlink.exe | cut -d' ' -f1)
          out=$(install/masseuse-camlink.exe -state-dir "$(cygpath -w "${RUNNER_TEMP}/state-2")" update)
          echo "$out"
          echo "$out" | grep -q "^A newer release: ${GITHUB_REF_NAME} (running v0.10.0), signed by https://github.com/FemLed/masseuse-camlink/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}"
          echo "$out" | grep -q "^Downloaded and verified masseuse-camlink_${GITHUB_REF_NAME#v}_windows_amd64.zip .*provenance by https://github.com/slsa-framework/slsa-github-generator/"
          echo "$out" | grep -q "^Updated to ${GITHUB_REF_NAME}\."
          test "$(install/masseuse-camlink.exe --version | cut -d' ' -f1)" = "${GITHUB_REF_NAME}"
          test -f install/.previous/masseuse-camlink.exe
          test "$(sha256sum install/masseuse-camlink.exe | cut -d' ' -f1)" = "$before"
          test -d install/units
          echo "the connector took the release from GitHub, verified it and swapped it in"

  macos-app:
    # The Mac download (packaging/macos/README.md): Masseuse.app,
    # universal, with the connector and ffmpeg inside, in
    # Masseuse.ai-<version>.dmg; app and image signed with the Developer ID,
    # notarized and stapled. The bundle's executable is the desktop window
    # (desktop/, docs/DESKTOP.md), built here for both architectures and
    # joined with lipo; the connector beside it is the two darwin binaries
    # goreleaser published, verified against the signed checksums.txt and
    # joined with lipo, so the reproduce job's result carries over: this job
    # checks that the bundled connector's slices strip to the very same
    # bytes. The window and ffmpeg are the two components not rebuilt byte
    # for byte (the window is cgo against the system's toolkit; ffmpeg is
    # built here from pinned upstream tarballs, packaging/ffmpeg/build.sh);
    # both are covered by darwin.intoto.jsonl. macOS
    # 26, because actool compiles the layered icon (packaging/macos/README.md,
    # "The icon") only on the system whose asset runtime it uses; ffmpeg
    # still targets 13.0 (-mmacosx-version-min), and the cache key carries
    # the image, so the first tag on a new image rebuilds it once.
    needs: goreleaser
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write # the disk image, checksums-darwin.txt and the source tarballs
      id-token: write # keyless signing (Fulcio)
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: The published darwin archives, verified
        # Nothing from the release is used before checksums.txt's keyless
        # signature and the archives' hashes have been checked.
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p published dist && cd published
          for i in $(seq 1 20); do
            gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber \
              --pattern checksums.txt --pattern checksums.txt.sigstore.json \
              --pattern "masseuse-camlink_${version}_darwin_arm64.tar.gz" \
              --pattern "masseuse-camlink_${version}_darwin_amd64.tar.gz" && break
            sleep 15
          done
          cosign verify-blob --bundle checksums.txt.sigstore.json \
            --certificate-identity-regexp '^https://github.com/FemLed/masseuse-camlink/[.]github/workflows/release[.]yml@refs/tags/v' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
          grep -E "_darwin_(arm64|amd64)\.tar\.gz$" checksums.txt | shasum -a 256 -c -
          for arch in arm64 amd64; do
            mkdir "$arch" && tar -xzf "masseuse-camlink_${version}_darwin_${arch}.tar.gz" -C "$arch" masseuse-camlink
          done
          lipo -create -output ../dist/masseuse-camlink arm64/masseuse-camlink amd64/masseuse-camlink
          echo "universal connector: $(lipo -archs ../dist/masseuse-camlink)"
      - name: Tools for the ffmpeg build
        id: tools
        run: |
          command -v nasm >/dev/null || brew install nasm
          command -v pkg-config >/dev/null || brew install pkgconf
          echo "image=${ImageOS:-macos}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ffmpeg-cache
        with:
          path: dist/ffmpeg
          # The recipe and the runner image decide the bytes; a change to
          # either rebuilds. The work tree is not kept.
          key: ffmpeg-${{ hashFiles('packaging/ffmpeg/**') }}-${{ steps.tools.outputs.image }}
      - name: Build ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: sh packaging/ffmpeg/build.sh -t darwin -o dist/ffmpeg -w "${RUNNER_TEMP}/ffmpeg-work"
      - name: The bundled ffmpeg runs the connector's own encoding chain
        # internal/capture's real-ffmpeg test: a Source on this binary, the
        # connector's exact arguments, a test picture and tone instead of a
        # camera, the stream read back.
        run: |
          lipo -archs dist/ffmpeg/ffmpeg | grep -q x86_64 || { echo "ffmpeg is not universal" >&2; exit 1; }
          CAPTURE_REAL_FFMPEG="${PWD}/dist/ffmpeg/ffmpeg" go test -count=1 -run 'TestRealFFmpegPublishes' -v ./internal/capture/
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # Saved as soon as it has passed, not at the end of the job: a failure
        # further on (signing, notarization) then does not cost the build
        # again on the next tag.
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          path: dist/ffmpeg
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}
      - name: The unit driver helpers, universal, verified
        # The same fetch as the goreleaser job's, for darwin/all: the
        # universal helpers the bundle takes (Contents/Helpers/units/,
        # docs/UNITS.md), each checked against its release's signed manifest.
        run: |
          sh packaging/units/fetch-all.sh darwin all dist/units
          for f in dist/units/camlink-unit-*; do echo "$(basename "$f"): $(lipo -archs "$f")"; done
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: The desktop window, universal
        # The Wails shell (desktop/): the page built once, the Go program
        # built for each architecture against the system's toolkit (cgo,
        # macOS 13 as the floor like the bundle's LSMinimumSystemVersion),
        # stamped with the tag as its version (--version answers it), and
        # joined with lipo.
        run: |
          (cd desktop/frontend && npm ci && npm run build)
          cd desktop
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOOS=darwin GOARCH="$arch" MACOSX_DEPLOYMENT_TARGET=13.0 \
              CGO_CFLAGS=-mmacosx-version-min=13.0 CGO_LDFLAGS=-mmacosx-version-min=13.0 \
              go build -tags production -trimpath -buildvcs=false \
                -ldflags="-w -s -X main.version=${GITHUB_REF_NAME}" -o "../dist/shell-${arch}" .
          done
          cd ..
          lipo -create -output dist/Masseuse dist/shell-arm64 dist/shell-amd64
          echo "universal window: $(lipo -archs dist/Masseuse)"
          test "$(dist/Masseuse --version | cut -d' ' -f1)" = "${GITHUB_REF_NAME}" || { echo "the window's --version is not the tag" >&2; exit 1; }
      - name: Assemble the bundle
        run: sh packaging/macos/build-app.sh -v "${GITHUB_REF_NAME#v}" -s dist/Masseuse -b dist/masseuse-camlink -f dist/ffmpeg -u dist/units -o dist
      - name: Sign, notarize and staple the bundle
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          # Referenced so the runner masks the certificate's subject wherever
          # a tool might print it; the scripts themselves never do.
          MACOS_SIGN_SUBJECT: ${{ secrets.MACOS_SIGN_SUBJECT }}
        run: sh packaging/macos/sign-notarize.sh app dist/Masseuse.app
      - name: Gatekeeper accepts the bundle, and it may open the camera
        # assess.sh app: the notarization verdict, and the entitlements
        # read back from the signatures: the bundle's executable (the
        # process macOS holds responsible for what ffmpeg opens) and ffmpeg
        # carry the camera and microphone entitlements, the connector and
        # the helpers none (packaging/macos/sign-app.sh). A bundle whose
        # executable lacks them is refused the camera without a prompt
        # (v0.16.0, v0.17.0), so the release fails here instead.
        run: sh packaging/macos/assess.sh app dist/Masseuse.app
      - name: The bundle's helpers are the manifest's, and the connector finds them
        # The thin darwin helpers, fetched and checked against the manifest
        # like the universal ones; then, signatures stripped on both sides
        # (the bundle's carry the Developer ID, the thin arm64 Go's ad-hoc
        # one), each slice of a bundled helper is byte for byte the thin
        # binary for its architecture. And the bundle's connector, run from
        # its own place, names the helpers on its first line
        # (Contents/Helpers/units is where it looks).
        run: |
          for arch in arm64 amd64; do
            sh packaging/units/fetch-all.sh darwin "$arch" "dist/units-${arch}"
          done
          n=0
          for f in dist/Masseuse.app/Contents/Helpers/units/camlink-unit-*; do
            name=$(basename "$f")
            go run ./cmd/machostrip -sha256 "$f" | tee "helper-${name}.txt"
            for arch in arm64 amd64; do
              thin=$(go run ./cmd/machostrip -sha256 "dist/units-${arch}/${name}" | cut -d' ' -f1)
              grep -qF "${thin}  ${f} (${arch})" "helper-${name}.txt" ||
                { echo "${name} (${arch}) in the bundle is not the manifest's darwin/${arch} binary" >&2; exit 1; }
              echo "${name} (${arch}) is the manifest's darwin/${arch} binary (${thin})"
            done
            n=$((n + 1))
          done
          test "$n" -gt 0 || { echo "the bundle carries no helpers" >&2; exit 1; }
          echo "${n} helper(s) in the bundle, each the manifest's"
          dist/Masseuse.app/Contents/MacOS/masseuse-camlink -state-dir "${RUNNER_TEMP}/probe-state" -estim-ble off estim probe > probe.txt 2>&1 || true
          grep -F "Unit drivers: Mastago (built in) + ${n} helper(s)" probe.txt ||
            { cat probe.txt; echo "the bundle's connector does not find its helpers" >&2; exit 1; }
      - name: The bundle's connector is the archives' binaries
        # Signature stripped, each slice of the universal connector inside
        # the bundle is byte for byte the archive's binary for that
        # architecture, which the reproduce job ties to the proxy rebuild.
        # The window beside it is not rebuilt byte for byte; its Developer
        # ID signature and darwin.intoto.jsonl vouch for it.
        run: |
          go run ./cmd/machostrip -sha256 dist/Masseuse.app/Contents/MacOS/masseuse-camlink | tee bundle.txt
          for arch in arm64 amd64; do
            thin=$(go run ./cmd/machostrip -sha256 "published/${arch}/masseuse-camlink" | cut -d' ' -f1)
            grep -qF "${thin}  dist/Masseuse.app/Contents/MacOS/masseuse-camlink (${arch})" bundle.txt ||
              { echo "the bundle's ${arch} connector slice is not the published darwin/${arch} binary" >&2; exit 1; }
            echo "the bundle's ${arch} connector slice is the published darwin/${arch} binary (${thin})"
          done
          test "$(dist/Masseuse.app/Contents/MacOS/Masseuse --version | cut -d' ' -f1)" = "${GITHUB_REF_NAME}"
      - name: Disk image, signed, notarized and stapled
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_SIGN_SUBJECT: ${{ secrets.MACOS_SIGN_SUBJECT }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sh packaging/macos/build-dmg.sh -a dist/Masseuse.app -v "$version" -o dist
          sh packaging/macos/sign-notarize.sh dmg "dist/Masseuse.ai-${version}.dmg"
          sh packaging/macos/assess.sh dmg "dist/Masseuse.ai-${version}.dmg"
      - name: checksums-darwin.txt, signed keyless
        # The image and the ffmpeg source tarballs (the LGPL source offer,
        # packaging/ffmpeg/THIRD_PARTY.md), hashed and signed like
        # checksums.txt.
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp dist/ffmpeg/sources/*.tar.* dist/
          cd dist
          shasum -a 256 "Masseuse.ai-${version}.dmg" ffmpeg-*.tar.xz opus-*.tar.gz > checksums-darwin.txt
          cat checksums-darwin.txt
          cosign sign-blob --yes --bundle checksums-darwin.txt.sigstore.json checksums-darwin.txt
      - name: Upload to the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber \
            "dist/Masseuse.ai-${version}.dmg" \
            dist/checksums-darwin.txt dist/checksums-darwin.txt.sigstore.json \
            dist/ffmpeg-*.tar.xz dist/opus-*.tar.gz
      - name: Subjects for provenance
        id: hashes
        run: echo "hashes=$(base64 < dist/checksums-darwin.txt | tr -d '\n')" >> "$GITHUB_OUTPUT"

  provenance-darwin:
    needs: macos-app
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.macos-app.outputs.hashes }}
      provenance-name: darwin.intoto.jsonl
      upload-assets: true

  update-check-macos:
    # The application bundle updates itself from the disk image (update-check
    # above says why): the published app, copied where a person would keep
    # it, told it is an older release, downloads this release's image,
    # checks the application inside as Gatekeeper does, copies it out and
    # swaps it in.
    needs: [macos-app, provenance-darwin]
    runs-on: macos-26
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # For packaging/macos/assess.sh alone; the application under test is
        # the published one, below.
        with:
          persist-credentials: false
      - name: The published application, in an Applications folder of its own
        run: |
          version="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 20); do
            gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber \
              --pattern "Masseuse.ai-${version}.dmg" && break
            sleep 15
          done
          mkdir -p Applications mnt
          hdiutil attach -nobrowse -readonly -mountpoint mnt "Masseuse.ai-${version}.dmg"
          ditto mnt/Masseuse.app Applications/Masseuse.app
          hdiutil detach mnt
          Applications/Masseuse.app/Contents/MacOS/Masseuse --version
          Applications/Masseuse.app/Contents/MacOS/masseuse-camlink --version
      - name: It knows it is the latest release
        # The connector inside the bundle is what updates; run from its
        # place in the bundle it knows the bundle is what it replaces.
        run: |
          out=$(Applications/Masseuse.app/Contents/MacOS/masseuse-camlink -state-dir "${RUNNER_TEMP}/state-1" update)
          echo "$out"
          echo "$out" | grep -q "^Up to date: ${GITHUB_REF_NAME} is the latest release"
      - name: As an older release, it updates itself to this one
        env:
          MASSEUSE_CAMLINK_UPDATE_AS: v0.10.0
        run: |
          out=$(Applications/Masseuse.app/Contents/MacOS/masseuse-camlink -state-dir "${RUNNER_TEMP}/state-2" -install-root "${PWD}/Applications/Masseuse.app" update)
          echo "$out"
          echo "$out" | grep -q "^Downloaded and verified Masseuse.ai-${GITHUB_REF_NAME#v}.dmg"
          echo "$out" | grep -q "^Updated to ${GITHUB_REF_NAME}\."
          # The previous bundle goes under the state directory, not beside
          # the new one: the Applications folder shows one application.
          test -d "${RUNNER_TEMP}/state-2/previous/Masseuse.app"
          test "$(ls Applications | wc -l)" -eq 1
          test "$(Applications/Masseuse.app/Contents/MacOS/Masseuse --version | cut -d' ' -f1)" = "${GITHUB_REF_NAME}"
          test "$(Applications/Masseuse.app/Contents/MacOS/masseuse-camlink --version | cut -d' ' -f1)" = "${GITHUB_REF_NAME}"
          codesign --verify --deep --strict Applications/Masseuse.app
          spctl --assess --type execute -vv Applications/Masseuse.app 2>&1 | grep -q accepted
          # The installed copy is what macOS reads when ffmpeg opens the
          # camera: its executable and ffmpeg carry the entitlements, the
          # connector and the helpers none.
          sh packaging/macos/assess.sh entitlements Applications/Masseuse.app
          ls Applications/Masseuse.app/Contents/Helpers/units/
          echo "the application took the release from GitHub, verified it and swapped it in"

  ffmpeg-windows:
    # ffmpeg.exe for the Windows download: the same pinned upstream tarballs
    # as the Mac's, cross-compiled here on Linux with mingw-w64 (a package
    # away; packaging/ffmpeg/build.sh -t windows), where it cannot run. It
    # is run, and tested, in windows-app. Independent of goreleaser, so it
    # builds while the release is assembled.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cross toolchain
        id: tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 nasm pkg-config
          x86_64-w64-mingw32-gcc --version | head -n 1
          echo "image=${ImageOS:-ubuntu}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ffmpeg-cache
        with:
          path: dist/ffmpeg-windows
          key: ffmpeg-windows-${{ hashFiles('packaging/ffmpeg/**') }}-${{ steps.tools.outputs.image }}
      - name: Build ffmpeg.exe
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: sh packaging/ffmpeg/build.sh -t windows -o dist/ffmpeg-windows -w "${RUNNER_TEMP}/ffmpeg-work"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          path: dist/ffmpeg-windows
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-windows
          path: dist/ffmpeg-windows
          if-no-files-found: error
          retention-days: 7

  windows-app:
    # The Windows download (packaging/windows): one Masseuse.exe (the name
    # the Mac bundle has too, Masseuse.app; the program calls itself
    # Masseuse.ai): the desktop window (desktop/, docs/DESKTOP.md) built
    # here, with the windows_amd64 connector goreleaser published, verified
    # against the signed checksums.txt, ffmpeg.exe from ffmpeg-windows, the
    # unit driver helpers and the notices appended as a payload
    # (internal/payload; packaging/windows/pack), the files inside and the
    # whole signed with Azure Artifact Signing when the repository has the
    # credentials (the "Whether this run signs" step; without them the
    # package ships unsigned, as before v0.13). cmd/pestrip proves that
    # each signed file minus its signature is the file that was verified,
    # that the package minus its signature and payload is the window built
    # here, and that the connector in the payload minus its signature is
    # the published connector byte for byte. This runner is where the Windows ffmpeg
    # first runs: the smoke test and the connector's real-ffmpeg test gate
    # the package. The zip of releases before 0.13,
    # Masseuse.ai-<version>-windows.zip, is still published with the same
    # file inside under the name those releases used, Masseuse.ai.exe, for
    # the installs of those releases to update themselves from (their
    # updater runs and swaps in the zip's Masseuse.ai.exe by that name).
    needs: [goreleaser, ffmpeg-windows]
    runs-on: windows-2022
    timeout-minutes: 45
    # The federated credential Artifact Signing trusts names this
    # environment (packaging/windows/README.md, "Signing"). The keyless
    # cosign identity is the workflow's and does not change with it.
    environment: release
    permissions:
      contents: write # the package, the zip and checksums-windows.txt
      id-token: write # keyless signing (Fulcio) and the Azure login (OIDC)
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Media Foundation
        # Windows Server carries Media Foundation as an optional feature; the
        # h264_mf encoder, and so the smoke test and the real-ffmpeg test,
        # need it.
        shell: pwsh
        run: |
          $f = Get-WindowsFeature Server-Media-Foundation
          if ($f.Installed) { "Media Foundation is present"; exit 0 }
          $r = Install-WindowsFeature Server-Media-Foundation
          "installed Media Foundation: success $($r.Success), restart needed $($r.RestartNeeded)"
          if (-not $r.Success) { exit 1 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-windows
          path: dist/ffmpeg-windows
      - name: The Windows ffmpeg runs, with what the connector asks of it
        run: sh packaging/ffmpeg/smoke.sh -t windows dist/ffmpeg-windows/ffmpeg.exe
      - name: The bundled ffmpeg runs the connector's own encoding chain
        # internal/capture's real-ffmpeg test on Windows: a Source with the
        # dshow arguments and h264_mf, a test picture and tone instead of a
        # camera, the stream read back.
        run: CAPTURE_REAL_FFMPEG="$(cygpath -w "${PWD}/dist/ffmpeg-windows/ffmpeg.exe")" go test -count=1 -run 'TestRealFFmpegPublishes' -v ./internal/capture/
      - name: The published windows_amd64 archive, verified
        # Nothing from the release is used before checksums.txt's keyless
        # signature and the archive's hash have been checked.
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p published dist && cd published
          for i in $(seq 1 20); do
            gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber \
              --pattern checksums.txt --pattern checksums.txt.sigstore.json \
              --pattern "masseuse-camlink_${version}_windows_amd64.zip" && break
            sleep 15
          done
          # [.] rather than \. : Git Bash rewrites a backslash in an argument to
          # a native program (cosign) as a path separator, \. becoming /.
          cosign verify-blob --bundle checksums.txt.sigstore.json \
            --certificate-identity-regexp '^https://github.com/FemLed/masseuse-camlink/[.]github/workflows/release[.]yml@refs/tags/v' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
          grep -E "_windows_amd64\.zip$" checksums.txt | sha256sum -c -
          7z e -y -o. "masseuse-camlink_${version}_windows_amd64.zip" masseuse-camlink.exe > /dev/null
          cp masseuse-camlink.exe ../dist/masseuse-camlink.exe
          ../dist/masseuse-camlink.exe --version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: The desktop window
        # The Wails shell (desktop/): the page built, then the Go program
        # for the GUI subsystem (no console; the connector's runs hidden
        # behind it), with the committed resource object
        # (desktop/rsrc_windows_amd64.syso, packaging/windows/make-syso.sh)
        # and the tag as its version, which --version answers.
        run: |
          (cd desktop/frontend && npm ci && npm run build)
          (cd desktop && CGO_ENABLED=0 go build -tags production -trimpath -buildvcs=false \
            -ldflags="-w -s -H windowsgui -X main.version=${GITHUB_REF_NAME}" -o ../dist/shell/Masseuse.exe .)
          test "$(dist/shell/Masseuse.exe --version | cut -d' ' -f1)" = "${GITHUB_REF_NAME}" || { echo "the window's --version is not the tag" >&2; exit 1; }
      - name: The programs carry their Windows resources
        # The icon and the strings Explorer shows come from the committed
        # .syso files (packaging/windows/make-syso.sh), the connector's
        # linked by goreleaser's proxy build like any other.
        # packaging/windows/verinfo reads them the way Explorer does
        # (PowerShell's VersionInfo would report them empty: the resource
        # carries no FileVersion string on purpose).
        run: |
          for exe in dist/masseuse-camlink.exe dist/shell/Masseuse.exe; do
            go run ./packaging/windows/verinfo "$exe" | tee dist/verinfo.txt
            grep -qx 'ProductName: Masseuse.ai' dist/verinfo.txt
            grep -qx 'CompanyName: FemLed, Inc.' dist/verinfo.txt
            grep -qx 'FileDescription: Masseuse.ai for your computer' dist/verinfo.txt
          done
      - name: The unit driver helpers for Windows, verified
        run: sh packaging/units/fetch-all.sh windows amd64 dist/units
      - name: Whether this run signs
        # Artifact Signing needs the Azure credentials (repository secrets)
        # and the account (repository variables; packaging/windows/README.md,
        # "Signing"). Without them the package is built, checked and
        # published unsigned, and the run says so.
        id: signing
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$ENDPOINT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "signing with Artifact Signing at $ENDPOINT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no Artifact Signing credentials (secret AZURE_CLIENT_ID, variable ARTIFACT_SIGNING_ENDPOINT): the Windows package ships unsigned"
          fi
      - name: What goes into the package
        # The payload's programs are signed one by one before packing (each
        # runs as a program of its own once unpacked: the connector,
        # ffmpeg, the helpers); unsigned copies are kept to compare the
        # signed ones with.
        run: |
          mkdir -p dist/pack/units dist/unsigned/units
          cp dist/masseuse-camlink.exe dist/pack/masseuse-camlink.exe
          cp dist/ffmpeg-windows/ffmpeg.exe dist/pack/ffmpeg.exe
          cp -r dist/ffmpeg-windows/licenses dist/pack/licenses
          cp dist/units/camlink-unit-*.exe dist/pack/units/
          cp dist/pack/masseuse-camlink.exe dist/unsigned/masseuse-camlink.exe
          cp dist/pack/ffmpeg.exe dist/unsigned/ffmpeg.exe
          cp dist/pack/units/*.exe dist/unsigned/units/
      - name: Azure login (OIDC)
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the connector, ffmpeg.exe and the helpers (Artifact Signing)
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16 # v1.2.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\pack
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Masseuse.ai for your computer
          description-url: https://masseuse.ai
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: The signed files are the verified files
        # cmd/pestrip takes the signature off and zeroes the checksum, on
        # both sides (ffmpeg's linker writes one): what remains must be
        # what was verified a moment ago. For the Go-built connector and
        # helpers the stripped hash is the plain one: the published
        # binary's, the manifest's.
        run: |
          for g in dist/pack/masseuse-camlink.exe dist/pack/ffmpeg.exe dist/pack/units/camlink-unit-*.exe; do
            rel=${g#dist/pack/}
            a=$(go run ./cmd/pestrip -sha256 "$g")
            b=$(go run ./cmd/pestrip -sha256 "dist/unsigned/$rel")
            [ "$a" = "$b" ] || { echo "$rel: signed and stripped $a, unsigned $b" >&2; exit 1; }
            echo "ok  $rel  $a"
          done
          for g in dist/unsigned/masseuse-camlink.exe dist/unsigned/units/camlink-unit-*.exe; do
            [ "$(go run ./cmd/pestrip -sha256 "$g")" = "$(sha256sum "$g" | cut -d' ' -f1)" ] ||
              { echo "$g: a Go binary whose stripped hash is not its plain hash" >&2; exit 1; }
          done
      - name: Assemble the package
        run: go run ./packaging/windows/pack -v "${GITHUB_REF_NAME#v}" -s dist/shell/Masseuse.exe -b dist/pack/masseuse-camlink.exe -f dist/pack -u dist/pack/units -o dist/Masseuse.exe
      - name: Sign the package (Artifact Signing)
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16 # v1.2.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\Masseuse.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Masseuse.ai for your computer
          description-url: https://masseuse.ai
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: The package is the window, with the published connector inside
        # pestrip: signature off, payload off, and the hash is the window
        # built above; the payload written out is the signed connector,
        # ffmpeg and helpers, byte for byte, and the connector minus its
        # signature is the published windows_amd64 binary.
        run: |
          got=$(go run ./cmd/pestrip -sha256 dist/Masseuse.exe)
          want=$(sha256sum dist/shell/Masseuse.exe | cut -d' ' -f1)
          [ "$got" = "$want" ] || { echo "Masseuse.exe stripped is $got, the window $want" >&2; exit 1; }
          echo "ok  Masseuse.exe minus its signature and payload is the window built here: $got"
          go run ./cmd/pestrip -payload dist/payload-check dist/Masseuse.exe | tee dist/payload.txt
          for g in dist/pack/masseuse-camlink.exe dist/pack/ffmpeg.exe dist/pack/units/camlink-unit-*.exe; do
            rel=${g#dist/pack/}
            cmp "$g" "dist/payload-check/$rel" || { echo "$rel in the payload is not the signed file" >&2; exit 1; }
          done
          inside=$(go run ./cmd/pestrip -sha256 dist/payload-check/masseuse-camlink.exe)
          published=$(sha256sum dist/masseuse-camlink.exe | cut -d' ' -f1)
          [ "$inside" = "$published" ] || { echo "the connector in the payload, stripped, is $inside; the published one $published" >&2; exit 1; }
          echo "ok  the connector in the payload minus its signature is the published windows_amd64 binary: $published"
          n=$(ls dist/pack/units/camlink-unit-*.exe | wc -l | tr -d ' ')
          [ "$(grep -c ' units/camlink-unit-.*\.exe$' dist/payload.txt)" = "$n" ] || { echo "the payload does not carry every helper" >&2; exit 1; }
      - name: Windows' verdict on the signatures
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $files = @('dist/Masseuse.exe', 'dist/pack/masseuse-camlink.exe', 'dist/pack/ffmpeg.exe') + (Get-ChildItem dist/pack/units/*.exe | ForEach-Object FullName)
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f
            "$($s.Status)  $($s.SignerCertificate.Subject)  $f"
            if ($s.Status -ne 'Valid') { throw "$f is not validly signed: $($s.Status) $($s.StatusMessage)" }
          }
      - name: The package runs alone
        # Copied to a directory of its own, as a download is, the window
        # answers --version without opening. The payload, unpacked as the
        # window unpacks it (bin\<id>\ under the state directory: the same
        # files pestrip wrote out), has the connector name the helpers on
        # its first line and find its ffmpeg beside itself (devices lists
        # none on the runner but runs ffmpeg to say so).
        run: |
          alone="${RUNNER_TEMP}/alone"; mkdir -p "$alone" && cp dist/Masseuse.exe "$alone/"
          state="$(cygpath -w "${RUNNER_TEMP}/probe-state")"
          "$alone/Masseuse.exe" --version
          n=$(ls dist/pack/units/camlink-unit-*.exe | wc -l | tr -d ' ')
          dist/payload-check/masseuse-camlink.exe -state-dir "$state" -estim-ble off estim probe > probe.txt 2>&1 || true
          grep -F "Unit drivers: Mastago (built in) + ${n} helper(s)" probe.txt ||
            { cat probe.txt; echo "the package's connector does not find its helpers" >&2; exit 1; }
          dist/payload-check/masseuse-camlink.exe -state-dir "$state" devices
      - name: The zip for installs before 0.13
        # Those update themselves from Masseuse.ai-<version>-windows.zip: their
        # updater runs `--version` on the zip's Masseuse.ai.exe, by that
        # name, and swaps it in under the running program's name. So the
        # zip holds this package under the old name; it then runs from its
        # payload and ignores the files left beside it.
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/zip && cp dist/Masseuse.exe dist/zip/Masseuse.ai.exe
          (cd dist/zip && 7z a -tzip -mx=9 -bso0 -bsp0 "../Masseuse.ai-${version}-windows.zip" Masseuse.ai.exe > /dev/null)
          7z l -ba "dist/Masseuse.ai-${version}-windows.zip" | tr -d '\r' | grep -q ' Masseuse.ai.exe$'
      - name: checksums-windows.txt, signed keyless
        # The package and the zip, hashed and signed like checksums.txt.
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd dist
          # sha256sum on Windows hashes in binary mode and marks the name with
          # an asterisk; the file keeps the two-space form the other checksum
          # files have, which is also the name the provenance's subject gets.
          sha256sum Masseuse.exe "Masseuse.ai-${version}-windows.zip" | sed 's/ \*/  /' > checksums-windows.txt
          cat checksums-windows.txt
          cosign sign-blob --yes --bundle checksums-windows.txt.sigstore.json checksums-windows.txt
      - name: Upload to the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber \
            dist/Masseuse.exe "dist/Masseuse.ai-${version}-windows.zip" \
            dist/checksums-windows.txt dist/checksums-windows.txt.sigstore.json
      - name: Subjects for provenance
        id: hashes
        run: echo "hashes=$(base64 -w0 < dist/checksums-windows.txt)" >> "$GITHUB_OUTPUT"

  provenance-windows:
    needs: windows-app
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.windows-app.outputs.hashes }}
      provenance-name: windows.intoto.jsonl
      upload-assets: true

  update-check-windows:
    # The Windows package updates itself from the release's Masseuse.exe
    # (update-check above says why): the published package, downloaded to
    # a directory of its own as a person would, its connector unpacked as
    # the window unpacks it and told the package is what it replaces
    # (-install-root, as the window tells it) and that it is an older
    # release, downloads this release's package, checks it (the new
    # window's --version) and swaps it in; the running program may be
    # renamed, never overwritten, and lands in .previous\. The zip for
    # installs before 0.13 holds the same file under the name those
    # installs know it by.
    needs: [windows-app, provenance-windows]
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: The published package, on its own
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir install
          for i in $(seq 1 20); do
            gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber --dir install \
              --pattern Masseuse.exe --pattern "Masseuse.ai-${version}-windows.zip" && break
            sleep 15
          done
          mkdir fromzip && (cd fromzip && 7z x -y "../install/Masseuse.ai-${version}-windows.zip" > /dev/null)
          cmp install/Masseuse.exe fromzip/Masseuse.ai.exe
          rm -r fromzip "install/Masseuse.ai-${version}-windows.zip"
          install/Masseuse.exe --version
          # The connector, out of the payload as the window takes it.
          go run ./cmd/pestrip -payload payload install/Masseuse.exe
          payload/masseuse-camlink.exe --version
      - name: It knows it is the latest release
        run: |
          out=$(payload/masseuse-camlink.exe -state-dir "$(cygpath -w "${RUNNER_TEMP}/state-1")" -install-root "$(cygpath -w "${PWD}/install/Masseuse.exe")" update)
          echo "$out"
          echo "$out" | grep -q "^Up to date: ${GITHUB_REF_NAME} is the latest release"
      - name: As an older release, it updates itself to this one
        env:
          MASSEUSE_CAMLINK_UPDATE_AS: v0.10.0
        run: |
          before=$(sha256sum install/Masseuse.exe | cut -d' ' -f1)
          out=$(payload/masseuse-camlink.exe -state-dir "$(cygpath -w "${RUNNER_TEMP}/state-2")" -install-root "$(cygpath -w "${PWD}/install/Masseuse.exe")" update)
          echo "$out"
          echo "$out" | grep -q "^Downloaded and verified Masseuse.exe"
          echo "$out" | grep -q "^Updated to ${GITHUB_REF_NAME}\."
          test -f install/.previous/Masseuse.exe
          test "$(install/Masseuse.exe --version | cut -d' ' -f1)" = "${GITHUB_REF_NAME}"
          test "$(sha256sum install/Masseuse.exe | cut -d' ' -f1)" = "$before"
          test "$(ls -A install | wc -l | tr -d ' ')" = "2" # the package and .previous, nothing beside
          echo "the package took the release from GitHub, verified it and swapped it in"
