name: ffmpeg

# The bundled ffmpeg (packaging/ffmpeg) is built by the release workflow
# alone, so a change to its recipe would first run after the tag, and a tag
# cannot be moved. This builds both ffmpegs from the same recipe the way
# the release does and runs what the release runs on them (the smoke test,
# and internal/capture's real-ffmpeg tests: the connector's encoding chain
# and the window's preview) on every pull request that touches the recipe
# or the arguments the connector gives it.
on:
  pull_request:
    paths:
      - packaging/ffmpeg/**
      - internal/capture/**
      - .github/workflows/ffmpeg.yml

permissions:
  contents: read

concurrency:
  group: ffmpeg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # As release.yml's macos-app builds it: universal, smoke-tested on both
    # slices by build.sh, then the connector's own chains on it.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Tools for the ffmpeg build
        run: |
          command -v nasm >/dev/null || brew install nasm
          command -v pkg-config >/dev/null || brew install pkgconf
      - name: Build ffmpeg
        run: sh packaging/ffmpeg/build.sh -t darwin -o dist/ffmpeg -w "${RUNNER_TEMP}/ffmpeg-work"
      - name: The connector's encoding chain and the window's preview on it
        run: |
          lipo -archs dist/ffmpeg/ffmpeg | grep -q x86_64 || { echo "ffmpeg is not universal" >&2; exit 1; }
          CAPTURE_REAL_FFMPEG="${PWD}/dist/ffmpeg/ffmpeg" go test -count=1 -run 'TestRealFFmpeg(Publishes|Previews)' -v ./internal/capture/

  windows-build:
    # As release.yml's ffmpeg-windows builds it: cross-compiled on Linux,
    # where it cannot run.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 nasm pkg-config
          x86_64-w64-mingw32-gcc --version | head -n 1
      - name: Build ffmpeg.exe
        run: sh packaging/ffmpeg/build.sh -t windows -o dist/ffmpeg-windows -w "${RUNNER_TEMP}/ffmpeg-work"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-windows
          path: dist/ffmpeg-windows
          retention-days: 3

  windows:
    # As release.yml's windows-app runs it, before it packages anything.
    needs: windows-build
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Media Foundation
        # The h264_mf encoder, and so both tests, need it; Windows Server
        # carries it as an optional feature.
        shell: pwsh
        run: |
          $f = Get-WindowsFeature Server-Media-Foundation
          if ($f.Installed) { "Media Foundation is present"; exit 0 }
          $r = Install-WindowsFeature Server-Media-Foundation
          "installed Media Foundation: success $($r.Success), restart needed $($r.RestartNeeded)"
          if (-not $r.Success) { exit 1 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-windows
          path: dist/ffmpeg-windows
      - name: The Windows ffmpeg runs, with what the connector asks of it
        run: sh packaging/ffmpeg/smoke.sh -t windows dist/ffmpeg-windows/ffmpeg.exe
      - name: The connector's encoding chain and the window's preview on it
        run: CAPTURE_REAL_FFMPEG="$(cygpath -w "${PWD}/dist/ffmpeg-windows/ffmpeg.exe")" go test -count=1 -run 'TestRealFFmpeg(Publishes|Previews)' -v ./internal/capture/
